  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <use href="#module" transform="translate(110 330) rotate(-12)" opacity=".55"/>
  <use href="#module" transform="translate(80 210) rotate(-12)"/>

  <!-- Preisindex -->
  <g transform="translate(840 150)" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="290" height="330" fill="#0a1522" opacity=".75" stroke="#2a4660"/>
    <text x="20" y="34" font-size="17" fill="#ffffff" font-weight="600">DRAM-Preise</text>
    <text x="20" y="56" font-size="13" fill="#8fa7ba">Index, Jan. 2025 = 100 (schematisch)</text>
    <g fill="#4fb0a8">
      <rect x="28" y="246" width="30" height="54"/><rect x="72" y="232" width="30" height="68"/>
      <rect x="116" y="196" width="30" height="104"/><rect x="160" y="150" width="30" height="150"/>
    </g>
    <rect x="204" y="96" width="30" height="204" fill="#f2b200"/>
    <line x1="20" y1="300" x2="270" y2="300" stroke="#5a7389"/>
    <g font-size="12" fill="#8fa7ba" text-anchor="middle">
      <text x="43" y="318">Q1/25</text><text x="87" y="318">Q3/25</text><text x="131" y="318">Q1/26</text><text x="175" y="318">Q2/26</text><text x="219" y="318">Q3/26</text>
    </g>
  </g>
  <text x="40" y="650" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#6f879b">Illustration: Neue Eidgenössische Zeitung</text>
