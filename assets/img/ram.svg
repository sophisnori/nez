<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Illustration: Arbeitsspeicher-Module</title>
  <desc id="d">Zwei schräg liegende RAM-Module mit Speicherchips und goldenen Kontakten auf dunklem Hintergrund, daneben ein steigender Preisindex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324a"/><stop offset="1" stop-color="#0b1726"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6b55"/><stop offset="1" stop-color="#144a3b"/>
    </linearGradient>
    <g id="module">
      <rect x="0" y="0" width="620" height="140" rx="6" fill="url(#pcb)"/>
      <rect x="0" y="0" width="620" height="140" rx="6" fill="none" stroke="#2c8a6e" stroke-width="2"/>
      <g fill="#1b1d22">
        <rect x="28" y="22" width="60" height="70" rx="3"/><rect x="100" y="22" width="60" height="70" rx="3"/>
        <rect x="172" y="22" width="60" height="70" rx="3"/><rect x="244" y="22" width="60" height="70" rx="3"/>
        <rect x="316" y="22" width="60" height="70" rx="3"/><rect x="388" y="22" width="60" height="70" rx="3"/>
        <rect x="460" y="22" width="60" height="70" rx="3"/><rect x="532" y="22" width="60" height="70" rx="3"/>
      </g>
      <rect x="0" y="112" width="620" height="28" fill="#0f3a2e"/>
      <g fill="#d9b44a">
        <rect x="14" y="116" width="6" height="24"/><rect x="26" y="116" width="6" height="24"/><rect x="38" y="116" width="6" height="24"/><rect x="50" y="116" width="6" height="24"/><rect x="62" y="116" width="6" height="24"/><rect x="74" y="116" width="6" height="24"/><rect x="86" y="116" width="6" height="24"/><rect x="98" y="116" width="6" height="24"/><rect x="110" y="116" width="6" height="24"/><rect x="122" y="116" width="6" height="24"/><rect x="134" y="116" width="6" height="24"/><rect x="146" y="116" width="6" height="24"/><rect x="158" y="116" width="6" height="24"/><rect x="170" y="116" width="6" height="24"/><rect x="182" y="116" width="6" height="24"/><rect x="194" y="116" width="6" height="24"/><rect x="206" y="116" width="6" height="24"/><rect x="218" y="116" width="6" height="24"/><rect x="230" y="116" width="6" height="24"/><rect x="242" y="116" width="6" height="24"/><rect x="254" y="116" width="6" height="24"/><rect x="266" y="116" width="6" height="24"/>
        <rect x="300" y="116" width="6" height="24"/><rect x="312" y="116" width="6" height="24"/><rect x="324" y="116" width="6" height="24"/><rect x="336" y="116" width="6" height="24"/><rect x="348" y="116" width="6" height="24"/><rect x="360" y="116" width="6" height="24"/><rect x="372" y="116" width="6" height="24"/><rect x="384" y="116" width="6" height="24"/><rect x="396" y="116" width="6" height="24"/><rect x="408" y="116" width="6" height="24"/><rect x="420" y="116" width="6" height="24"/><rect x="432" y="116" width="6" height="24"/><rect x="444" y="116" width="6" height="24"/><rect x="456" y="116" width="6" height="24"/><rect x="468" y="116" width="6" height="24"/><rect x="480" y="116" width="6" height="24"/><rect x="492" y="116" width="6" height="24"/><rect x="504" y="116" width="6" height="24"/><rect x="516" y="116" width="6" height="24"/><rect x="528" y="116" width="6" height="24"/><rect x="540" y="116" width="6" height="24"/><rect x="552" y="116" width="6" height="24"/><rect x="564" y="116" width="6" height="24"/><rect x="576" y="116" width="6" height="24"/><rect x="588" y="116" width="6" height="24"/><rect x="600" y="116" width="6" height="24"/>
      </g>
      <rect x="282" y="112" width="12" height="28" fill="url(#bg)"/>
      <rect x="440" y="96" width="150" height="12" fill="#e9eef2" opacity=".85"/>
