<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Grafik: Ständige Wohnbevölkerung der Schweiz 1990 bis 2035</title>
  <desc id="d">Liniendiagramm. Die Bevölkerung steigt von 6,75 Millionen (1990) auf rund 9,1 Millionen (2025). Eine gestrichelte Prognose erreicht 2031 die beschlossene Obergrenze von 9,8 Millionen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0e11"/>
      <stop offset="1" stop-color="#5c1418"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a8c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff9a8c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" fill="#f3e1de">
    <text x="70" y="78" font-size="30" font-weight="600" fill="#ffffff">Ständige Wohnbevölkerung der Schweiz</text>
    <text x="70" y="114" font-size="20" fill="#e6c6c2">in Millionen Personen, 1990–2025, Prognose bis 2035</text>

    <!-- Achsen: x 1990→2035 = 110→1130 (22,67 px/Jahr); y 6,5→10,5 Mio = 600→180 (105 px/Mio) -->
    <g stroke="#6e2c30" stroke-width="1">
      <line x1="110" y1="600" x2="1130" y2="600"/>
      <line x1="110" y1="495" x2="1130" y2="495"/>
      <line x1="110" y1="390" x2="1130" y2="390"/>
      <line x1="110" y1="285" x2="1130" y2="285"/>
      <line x1="110" y1="180" x2="1130" y2="180"/>
    </g>
    <g font-size="17" text-anchor="end" fill="#e0bdb9">
      <text x="98" y="606">6,5</text>
      <text x="98" y="501">7,5</text>
      <text x="98" y="396">8,5</text>
      <text x="98" y="291">9,5</text>
      <text x="98" y="186">10,5</text>
    </g>
    <g font-size="17" text-anchor="middle" fill="#e0bdb9">
      <text x="110" y="630">1990</text>
      <text x="337" y="630">2000</text>
      <text x="563" y="630">2010</text>
      <text x="790" y="630">2020</text>
      <text x="1017" y="630">2030</text>
    </g>

    <!-- Obergrenze 9,8 Mio → y = 600 - 3,3*105 = 253,5 -->
    <line x1="110" y1="253.5" x2="1130" y2="253.5" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 8"/>
    <text x="120" y="240" font-size="19" font-weight="600" fill="#ffffff">Obergrenze 9,8 Mio.</text>

    <!-- Messwerte -->
    <polygon fill="url(#area)" points="110,573.75 223,543 337,526.5 450,499 563,456 677,408 790,372 835,356 903,327 903,600 110,600"/>
    <polyline fill="none" stroke="#ffd6cf" stroke-width="4" stroke-linejoin="round"
      points="110,573.75 223,543 337,526.5 450,499 563,456 677,408 790,372 835,356 903,327"/>
    <!-- Prognose -->
    <polyline fill="none" stroke="#ffd6cf" stroke-width="3" stroke-dasharray="6 7"
      points="903,327 1039,253.5 1130,211.5"/>
    <circle cx="903" cy="327" r="7" fill="#ffffff"/>
    <circle cx="1039" cy="253.5" r="8" fill="#ffffff" stroke="#3b0e11" stroke-width="3"/>
    <text x="903" y="362" font-size="18" text-anchor="middle" fill="#ffffff">2025: 9,1</text>
    <text x="1039" y="290" font-size="17" text-anchor="middle" fill="#ffffff">2031</text>

    <text x="70" y="660" font-size="15" fill="#cf9f9a">Quelle: Bundesamt für Statistik; Prognose: Bericht AG-BE40/2026-117 · Grafik: Neue Eidgenössische Zeitung</text>
  </g>
</svg>
